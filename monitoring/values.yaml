# monitoring/values.yaml

prometheus:
  prometheusSpec:
    retention: "7d"
    # Scrape the application services in the default namespace
    additionalScrapeConfigs:
      - job_name: "swishops-backend"
        metrics_path: /metrics
        static_configs:
          - targets:
              - "swishops-backend-svc.default.svc.cluster.local:80"
            labels:
              service: swishops-backend
      - job_name: "swishops-ai-service"
        metrics_path: /metrics
        static_configs:
          - targets:
              - "swishops-ai-service-svc.default.svc.cluster.local:80"
            labels:
              service: swishops-ai-service
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2048Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

grafana:
  enabled: true
  admin:
    existingSecret: "grafana-admin-credentials"
    userKey: "admin-user"
    passwordKey: "admin-password"
  persistence:
    enabled: true
    size: 5Gi
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
