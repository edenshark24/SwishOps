replicaCount: 2

image:
  repository: ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/swishops-dev-backend
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

config:
  environment: production
  logLevel: info

hpa:
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

db:
  host: ""
  name: "swishops"
  user: "dbadmin"
  port: "5432"
  passwordSecretName: "swishops-db-secret"
  passwordSecretKey: "password"
