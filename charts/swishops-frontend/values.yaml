replicaCount: 2

image:
  repository: ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/swishops-dev-frontend
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

hpa:
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

config:
  environment: production
  apiBaseUrl: "http://swishops-backend-svc"
  aiServiceUrl: "http://swishops-ai-service-svc"
  port: "3000"
