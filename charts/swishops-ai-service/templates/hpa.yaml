apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: swishops-ai-service-hpa
  labels:
    app.kubernetes.io/name: swishops-ai-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: swishops-ai-service
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}
