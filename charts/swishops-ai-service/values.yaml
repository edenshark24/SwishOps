replicaCount: 1

image:
  repository: ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/swishops-ai-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

config:
  environment: production
  modelName: "nba-stats-predictor-v1"

hpa:
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
